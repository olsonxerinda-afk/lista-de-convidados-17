<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Mesas Interativo - SONARE</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-title {
      color: #b89759;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 4px;
      margin: 10px 0 5px 0;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      color: #333;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.5rem;
      font-weight: 400;
    }

    .search-container {
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #b89759;
      border-radius: 25px;
      outline: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      box-shadow: 0 4px 12px rgba(184, 151, 89, 0.4);
    }

    .map-wrapper {
      position: relative;
      display: inline-block;
      max-width: 1000px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Estilo dos Marcadores */
    .pin {
      position: absolute;
      width: 4.8%;
      height: 6.2%;
      background-color: rgba(255, 215, 0, 0.4);
      border: 2px dashed #ff0000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s ease;
    }

    /* Animação quando a mesa é encontrada */
    .pin.active {
      opacity: 1;
      background-color: rgba(255, 0, 0, 0.45);
      border: 3px solid #ff0000;
      box-shadow: 0 0 20px 8px rgba(255, 0, 0, 0.7);
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.3); }
    }

    .no-results {
      color: #d9534f;
      margin-top: 8px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="brand-title">SONARE</div>
  <h1>Localizador de Mesas</h1>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Digite o número da mesa (ex: 5, Mesa-1, Honra)...">
    <div id="statusMessage" class="no-results"></div>
  </div>

  <div class="map-wrapper">
    <img id="mapImg" src="SONARE'1.jpeg" alt="Planta do Evento" class="map-image">

    <!-- Pinos mapeados em percentual conforme o layout do evento -->
    <div id="pin-1" class="pin" style="left: 33.7%; top: 27.2%;"></div>
    <div id="pin-2" class="pin" style="left: 32.7%; top: 46.2%;"></div>
    <div id="pin-3" class="pin" style="left: 14.8%; top: 27.2%;"></div>
    <div id="pin-4" class="pin" style="left: 22.0%; top: 46.2%;"></div>
    <div id="pin-5" class="pin" style="left: 24.3%; top: 33.5%;"></div>
    <div id="pin-6" class="pin" style="left: 22.0%; top: 60.5%;"></div>
    <div id="pin-7" class="pin" style="left: 11.5%; top: 45.2%;"></div>
    <div id="pin-8" class="pin" style="left: 33.7%; top: 69.5%;"></div>
    <div id="pin-9" class="pin" style="left: 69.5%; top: 46.2%;"></div>
    <div id="pin-10" class="pin" style="left: 11.5%; top: 68.5%;"></div>
    <div id="pin-11" class="pin" style="left: 78.5%; top: 32.5%;"></div>
    <div id="pin-12" class="pin" style="left: 65.5%; top: 69.5%;"></div>
    <div id="pin-13" class="pin" style="left: 66.0%; top: 29.5%;"></div>
    <div id="pin-14" class="pin" style="left: 79.2%; top: 65.0%;"></div>
    <div id="pin-15" class="pin" style="left: 89.2%; top: 29.5%;"></div>
    <div id="pin-16" class="pin" style="left: 89.2%; top: 65.0%;"></div>
    <div id="pin-honra" class="pin" style="left: 50.0%; top: 16.0%; width: 15%; height: 7%;"></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const statusMessage = document.getElementById('statusMessage');
    const pins = document.querySelectorAll('.pin');

    searchInput.addEventListener('input', function() {
      const query = searchInput.value.trim().toLowerCase();
      
      // Limpa destaques anteriores
      pins.forEach(pin => pin.classList.remove('active'));
      statusMessage.textContent = '';

      if (query === '') return;

      let targetId = '';

      // Trata pesquisas numéricas ou com texto
      if (query.includes('honra')) {
        targetId = 'pin-honra';
      } else {
        // Extrai apenas os números da busca
        const match = query.match(/\d+/);
        if (match) {
          const num = parseInt(match[0], 10);
          if (num >= 1 && num <= 16) {
            targetId = `pin-${num}`;
          }
        }
      }

      // Ativa o marcador correspondente
      if (targetId) {
        const targetPin = document.getElementById(targetId);
        if (targetPin) {
          targetPin.classList.add('active');
        }
      } else {
        statusMessage.textContent = 'Mesa não encontrada. Digite um número de 1 a 16 ou "Honra".';
      }
    });
  </script>

</body>
</html>
